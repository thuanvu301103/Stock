version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_pass
      POSTGRES_DB: n8n_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

  n8n-python:
    build: .
    image: n8n-python-custom
    container_name: n8n-python
    restart: always
    user: root
    environment:
      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}

      # Database config
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_pass

      # Execution process
      EXECUTIONS_PROCESS: main
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # Production mode
      NODE_ENV: production
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "admin@123456"
    
      PUID: 1000
      PGID: 1000

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local_files:/data/files
      - ./python_scripts:/data/py_scripts
      - ./requirements.txt:/data/requirements.txt
    depends_on:
      - postgres
      - redis

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: always
    ports:
      - "8123:8123" # HTTP (for n8n & UI)
      - "9000:9000" # Native (for Python/DBeaver)
    environment:
      - CLICKHOUSE_USER=n8n
      - CLICKHOUSE_PASSWORD=n8n_pass
      - CLICKHOUSE_DB=n8n_olap
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144